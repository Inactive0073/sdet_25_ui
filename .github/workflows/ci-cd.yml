name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (parallel via xdist) and collect allure results
        env:
          CI: true
        run: |
          # Запуск тестов параллельно на 2 воркерах (можно изменить)
          pytest -n 2 --alluredir=allure-results -q

      - name: Generate and publish Allure report
        uses: mikeal/allure-report-action@v1
        with:
          results_dir: allure-results
          output_dir: allure-report
